spring:
  profiles:
    active: local
  datasource:
    url: jdbc:h2:tcp://localhost/~/noticeDuri
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true

server:
  servlet:
    session:
      tracking-modes: cookie
  port: 8080

logging.level:
  org.hibernate.SQL: debug
#  org.hibernate.type: trace

kakao:
  client_id: 003481d0937b60feb487017be2d8ec1a
  redirect_uri: http://localhost:${server.port}/members/callback #카카오 설정에서 포트 8080으로 되어있음